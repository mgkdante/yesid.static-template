backend:
  name: github
  repo: yesid-dev/yesid.static-template
  branch: main
  base_url: https://login.yesid.dev
  auth_endpoint: auth/popup
  api_root: https://login.yesid.dev/yesid.static-template
  graphql_api_root: https://login.yesid.dev/yesid.static-template
media_folder: static/images/uploads
public_folder: /images/uploads
slug:
  encoding: ascii
  clean_accents: true
media_libraries:
  default:
    config:
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2048
          height: 2048
i18n:
  structure: multiple_files
  locales:
    - fr
    - en
    - es
  default_locale: fr
collections:
  - name: pages
    label: Pages
    icon: web
    format: json
    i18n: true
    files:
      - name: home
        label: Accueil
        file: "src/lib/content/home.{{locale}}.json"
        format: json
        i18n: true
        fields:
          - name: title
            label: Titre
            i18n: true
            widget: string
          - name: description
            label: Description pour les moteurs de recherche
            i18n: true
            widget: text
          - name: body
            label: Texte
            i18n: true
            widget: text
      - name: about
        label: À propos
        file: "src/lib/content/about.{{locale}}.json"
        format: json
        i18n: true
        fields:
          - name: title
            label: Titre
            i18n: true
            widget: string
          - name: description
            label: Description pour les moteurs de recherche
            i18n: true
            widget: text
          - name: body
            label: Texte
            i18n: true
            widget: text
      - name: blog
        label: Page du blog
        file: "src/lib/content/blog.{{locale}}.json"
        format: json
        i18n: true
        fields:
          - name: title
            label: Titre
            i18n: true
            widget: string
          - name: description
            label: Description pour les moteurs de recherche
            i18n: true
            widget: text
          - name: body
            label: Texte
            i18n: true
            widget: text
      - name: projects
        label: Page des projets
        file: "src/lib/content/projects.{{locale}}.json"
        format: json
        i18n: true
        fields:
          - name: title
            label: Titre
            i18n: true
            widget: string
          - name: description
            label: Description pour les moteurs de recherche
            i18n: true
            widget: text
          - name: body
            label: Texte
            i18n: true
            widget: text
  - name: everywhere
    label: Partout sur le site
    icon: public
    format: json
    i18n: true
    files:
      - name: menu
        label: Menu
        file: "src/lib/content/menu.{{locale}}.json"
        format: json
        i18n: true
        fields:
          - name: skip
            label: Aller au contenu
            i18n: true
            widget: string
          - name: navigation
            label: Nom du menu
            i18n: true
            widget: string
          - name: languages
            label: Nom du choix de langue
            i18n: true
            widget: string
      - name: footer
        label: Pied de page
        file: "src/lib/content/footer.{{locale}}.json"
        format: json
        i18n: true
        fields:
          - name: note
            label: Mention
            i18n: true
            widget: string
      - name: error
        label: Page d’erreur
        file: "src/lib/content/error.{{locale}}.json"
        format: json
        i18n: true
        fields:
          - name: title
            label: Titre
            i18n: true
            widget: string
          - name: description
            label: Description
            i18n: true
            widget: text
          - name: home
            label: Lien vers l’accueil
            i18n: true
            widget: string
  - name: legal
    label: Textes légaux
    icon: gavel
    format: json
    i18n: true
    files:
      - name: privacy
        label: Confidentialité
        file: "src/lib/content/privacy.{{locale}}.json"
        format: json
        i18n: true
        fields:
          - name: title
            label: Titre
            i18n: true
            widget: string
          - name: description
            label: Description pour les moteurs de recherche
            i18n: true
            widget: text
          - name: body
            label: Texte
            i18n: true
            widget: text
      - name: terms
        label: Conditions d’utilisation
        file: "src/lib/content/terms.{{locale}}.json"
        format: json
        i18n: true
        fields:
          - name: title
            label: Titre
            i18n: true
            widget: string
          - name: description
            label: Description pour les moteurs de recherche
            i18n: true
            widget: text
          - name: body
            label: Texte
            i18n: true
            widget: text
  - name: posts
    label: Blog
    folder: src/lib/content/posts
    create: true
    extension: md
    format: yaml-frontmatter
    i18n:
      initial_locales: default
    fields:
      - name: title
        label: Titre
        i18n: true
        widget: string
      - name: description
        label: Description pour les moteurs de recherche
        i18n: true
        widget: text
      - name: date
        label: Date
        i18n: duplicate
        widget: datetime
        format: YYYY-MM-DD
        time_format: false
      - name: photo
        label: Photo
        i18n: duplicate
        widget: image
        required: false
        accept: "image/jpeg,image/png,image/webp,image/avif,image/heic,image/heif"
      - name: photoAlt
        label: Description de la photo
        i18n: true
        widget: text
        required: false
      - name: body
        label: Texte
        i18n: true
        widget: richtext
  - name: projects
    label: Projets
    folder: src/lib/content/projects
    create: true
    extension: md
    format: yaml-frontmatter
    i18n:
      initial_locales: default
    fields:
      - name: name
        label: Nom du projet
        i18n: true
        widget: string
      - name: summary
        label: Résumé
        i18n: true
        widget: text
      - name: services
        label: Services
        widget: list
        i18n: true
        collapsed: true
        field:
          name: value
          label: Service
          i18n: true
          widget: string
      - name: body
        label: Présentation du projet
        i18n: true
        widget: richtext
    identifier_field: name
