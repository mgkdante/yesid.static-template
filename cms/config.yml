backend:
  name: github
  repo: mgkdante/yesid.static-template
  branch: main
  base_url: https://login.yesid.dev
  auth_endpoint: auth/popup
  api_root: https://login.yesid.dev/yesid.static-template
  graphql_api_root: https://login.yesid.dev/yesid.static-template
media_folder: static/images/uploads
public_folder: /images/uploads
i18n:
  structure: multiple_files
  locales:
    - fr
    - en
    - es
  default_locale: fr
collections:
  - name: pages
    label: Pages
    icon: web
    format: json
    i18n: true
    files:
      - name: home
        label: Accueil
        file: "src/lib/content/home.{{locale}}.json"
        format: json
        i18n: true
        fields:
          - name: title
            label: Titre
            i18n: true
            widget: string
          - name: description
            label: Description pour les moteurs de recherche
            i18n: true
            widget: text
          - name: body
            label: Texte
            i18n: true
            widget: text
      - name: about
        label: Page fixe
        file: "src/lib/content/about.{{locale}}.json"
        format: json
        i18n: true
        fields:
          - name: title
            label: Titre
            i18n: true
            widget: string
          - name: description
            label: Description pour les moteurs de recherche
            i18n: true
            widget: text
          - name: body
            label: Texte
            i18n: true
            widget: text
      - name: blog
        label: Page du blog
        file: "src/lib/content/blog.{{locale}}.json"
        format: json
        i18n: true
        fields:
          - name: title
            label: Titre
            i18n: true
            widget: string
          - name: description
            label: Description pour les moteurs de recherche
            i18n: true
            widget: text
          - name: body
            label: Texte
            i18n: true
            widget: text
  - name: everywhere
    label: Partout sur le site
    icon: public
    format: json
    i18n: true
    files:
      - name: shared
        label: Textes communs
        file: "src/lib/content/shared.{{locale}}.json"
        format: json
        i18n: true
        fields:
          - name: skip
            label: Aller au contenu
            i18n: true
            widget: string
          - name: navigation
            label: Navigation
            i18n: true
            widget: string
          - name: languages
            label: Langues
            i18n: true
            widget: string
          - name: error
            label: Page introuvable
            i18n: true
            widget: object
            collapsed: true
            fields:
              - name: title
                label: Titre
                i18n: true
                widget: string
              - name: description
                label: Description
                i18n: true
                widget: text
              - name: home
                label: Retour
                i18n: true
                widget: string
          - name: admin
            label: Connexion
            i18n: true
            widget: object
            collapsed: true
            fields:
              - name: title
                label: Titre
                i18n: true
                widget: string
              - name: description
                label: Description
                i18n: true
                widget: text
              - name: link
                label: Lien
                i18n: true
                widget: string
  - name: legal
    label: Textes légaux
    icon: gavel
    format: json
    i18n: true
    files:
      - name: legal
        label: Mentions légales
        file: "src/lib/content/legal.{{locale}}.json"
        format: json
        i18n: true
        fields:
          - name: title
            label: Titre
            i18n: true
            widget: string
          - name: description
            label: Description pour les moteurs de recherche
            i18n: true
            widget: text
          - name: body
            label: Texte
            i18n: true
            widget: text
  - name: posts
    label: Blog
    folder: src/lib/content/posts
    create: true
    extension: md
    format: yaml-frontmatter
    i18n: true
    fields:
      - name: title
        label: Titre
        i18n: true
        widget: string
      - name: description
        label: Description pour les moteurs de recherche
        i18n: true
        widget: text
      - name: date
        label: Date
        i18n: duplicate
        widget: datetime
        format: YYYY-MM-DD
        time_format: false
      - name: photo
        label: Photo
        i18n: duplicate
        widget: image
        required: false
      - name: photoAlt
        label: Description de la photo
        i18n: true
        widget: text
      - name: body
        label: Texte
        i18n: true
        widget: richtext
