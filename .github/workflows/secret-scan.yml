name: secret-scan
on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '17 10 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    uses: yesid-dev/ci/.github/workflows/gitleaks.yml@8f47b08d6fdc88d39f1d12f83f15191fdbeda327
    with:
      full-history: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
  gitleaks:
    name: gitleaks
    needs: scan
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require successful secret scan
        env:
          SCAN_RESULT: ${{ needs.scan.result }}
        run: test "$SCAN_RESULT" = success
