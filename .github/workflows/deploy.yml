name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-main
  cancel-in-progress: false
jobs:
  # No Cloudflare secret reaches this job, which runs dependency scripts and the build.
  build:
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run check
      # Builds first, so its tests read the same output.
      - run: bun run test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: site
          path: build
          if-no-files-found: error
          retention-days: 3

  # Uploads what the checks passed. Installs without scripts, so nothing but Wrangler runs beside the token.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site
          path: build
      - name: Upload only this Worker's assets
        run: bun scripts/deploy.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Editor saves are made by a bot, so GitHub's own failure email may reach no one. An assigned issue does.
  # It runs no repository code and carries only links.
  alert:
    needs: [build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          BODY: 'Commit ${{ github.sha }} did not publish, so the previous version stays online. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
        run: |
          title='Publishing failed'
          # Only this workflow's own issue counts: anyone with access can open one with this title.
          number=$(gh issue list --state open --limit 100 --json number,title,author \
            --jq "[.[] | select(.title == \"$title\" and .author.login == \"app/github-actions\")][0].number // empty")
          if [ -n "$number" ]; then
            gh issue edit "$number" --add-assignee "$OWNER"
            gh issue comment "$number" --body "$BODY"
          else
            gh issue create --title "$title" --assignee "$OWNER" --body "$BODY"
          fi
